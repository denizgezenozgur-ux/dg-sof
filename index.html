<style>
/* Layout: bridge-logbook tool — sticky vessel strip, four tabs, fixed bottom nav; report prints as a clean SOF sheet */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#0E2232; --muted:#5B6E7C; --line:#D3DCE1;
  --accent:#F2B705; --accent-ink:#1A1400; --navy:#0E2A44; --navy-ink:#F4F7F9;
  --ok:#1E7F4F; --warn:#B4540A; --bad:#B3261E; --chip:#E3EAEE;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1620; --surface:#12222F; --ink:#E6EEF2; --muted:#93A6B3; --line:#24384A;
  --accent:#F5C21C; --accent-ink:#1A1400; --navy:#06111A; --navy-ink:#E6EEF2;
  --ok:#4CC38A; --warn:#F0A04B; --bad:#F2867E; --chip:#1B3042; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1620; --surface:#12222F; --ink:#E6EEF2; --muted:#93A6B3; --line:#24384A;
  --accent:#F5C21C; --accent-ink:#1A1400; --navy:#06111A; --navy-ink:#E6EEF2;
  --ok:#4CC38A; --warn:#F0A04B; --bad:#F2867E; --chip:#1B3042; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:860px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.02em;text-transform:none;opacity:.75;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.clock{margin-left:auto;text-align:right;line-height:1.1}
.clock b{font-family:var(--f-mono);font-size:22px;font-weight:600;display:block}
.clock span{font-size:11.5px;opacity:.75}

main section{display:none;padding-block:16px 8px}
main section.on{display:block}
h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
h2:first-child{margin-top:4px}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--chip);border:1px dashed var(--muted);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner button{margin-left:auto}

/* one-tap grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tap{position:relative;border:0;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:14px 12px 12px;text-align:left;min-height:68px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s}
.tap:active{transform:scale(.97)}
.tap b{font-weight:600;font-size:14.5px;line-height:1.2}
.tap em{font-style:normal;font-size:12px;color:var(--muted);line-height:1.2}
.tap.key em{color:var(--accent-ink);opacity:.75}
.tap i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tap.done{box-shadow:inset 0 0 0 2px var(--accent)}
.tap.done i{color:var(--ink)}
.tap.key{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.tap.key i{color:var(--accent-ink);opacity:.8}
.tap.custom{border:1.5px dashed var(--muted);box-shadow:none;background:transparent;align-items:center;justify-content:center;text-align:center}

/* log list */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.log .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.25}
.log .t small{display:block;color:var(--muted);font-size:11px}
.log .e{min-width:0}
.log .e b{font-weight:600}
.log .e p{margin:2px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.log .thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.log .thumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.daysep{list-style:none;font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);padding:20px 0;text-align:center;font-size:14px}

.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:600;background:var(--chip);min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--navy);color:var(--navy-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* holds */
.sum{background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{min-width:0}
.sum span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.sum b{font-family:var(--f-mono);font-size:clamp(18px,5vw,26px);font-weight:600;font-variant-numeric:tabular-nums}
.sum .bar{grid-column:1/-1;height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.sum .bar i{display:block;height:100%;background:var(--accent)}
.sum .pct{grid-column:1/-1;font-size:13px;opacity:.85}
.holds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.hold{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hold header{display:flex;align-items:center;gap:8px}
.hold header input{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;border:0;background:transparent;width:100%;padding:0;min-width:0}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.hstats b{display:block;font-family:var(--f-mono);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.hbar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--ok)}
.hbar.over i{background:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.addq{display:grid;grid-template-columns:1fr auto;gap:6px}
.entries{font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.entries summary{cursor:pointer;color:var(--muted)}
.entries ul{list-style:none;margin:6px 0 0;padding:0}
.entries li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dotted var(--line)}
.entries li .mono{font-size:12.5px}
.entries li b{margin-left:auto;font-family:var(--f-mono)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}

/* voyage form */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.02em}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1}
.addph{border:1.5px dashed var(--muted);border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;padding:6px}
.addph input{display:none}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px}
.toast b{font-family:var(--f-mono)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 4px;white-space:nowrap}
:root:not([data-theme="dark"]) .toast button{color:#FFD24A}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:860px;margin:0 auto}
nav.tabs button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted);min-height:62px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{stroke:var(--ink)}
nav.tabs button.on span{box-shadow:0 2px 0 var(--accent)}

/* report */
.rep{background:#fff;color:#111;border-radius:6px;padding:20px;box-shadow:inset 0 0 0 1px var(--line);overflow-x:auto;font-size:12.5px}
.rep h1{font-family:var(--f-display);font-size:24px;letter-spacing:.06em;margin:0 0 2px;text-transform:uppercase;color:#111}
.rep .sub{color:#555;margin-bottom:12px}
.rep table{border-collapse:collapse;width:100%;min-width:520px;margin-bottom:14px}
.rep th,.rep td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}
.rep th{background:#e9ecee;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.rep td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rep td.m{font-family:var(--f-mono);white-space:nowrap}
.rep .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid #999;margin-bottom:14px}
.rep .kv div{padding:5px 7px;border-bottom:1px solid #ccc}
.rep .kv span{color:#555;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;display:block}
.rep h4{font-family:var(--f-display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 6px;color:#111}
.rep .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rep .photos figure{margin:0;break-inside:avoid}
.rep .photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #999}
.rep .photos figcaption{font-size:10.5px;color:#333}
.rep .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.rep .sign div{border-top:1px solid #333;padding-top:4px;font-size:11px;text-align:center}
.note{font-size:13px;color:var(--muted);margin:8px 0}
textarea.copybox{width:100%;height:160px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  body::before,header.top,nav.tabs,.toast,.noprint,main section:not(#tab-rep){display:none!important}
  main section#tab-rep{display:block!important;padding:0}
  .wrap{padding:0;max-width:none}
  .rep{box-shadow:none;padding:0;overflow:visible}
  .rep table{min-width:0}
  .rep tr{break-inside:avoid}
}
</style>
<style>
/* additions: fleet archive */
nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:11.5px}
header.top .brand{cursor:pointer}
.vcard{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.vhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.vhead h3{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;margin:0;line-height:1.05;text-transform:uppercase}
.vhead small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.vhead .row{margin-left:auto}
.sofs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sofs li{border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px}
.sofs li .open{flex:1;min-width:0}
.sofs .del{border:0;background:transparent;color:var(--muted);padding:10px 8px;font-size:13px;border-radius:8px;min-height:44px}
.sofs .del:hover{color:var(--bad)}
.sofs button.open{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:10px 2px;align-items:center}
.sofs .d{font-family:var(--f-mono);font-size:12.5px;line-height:1.3;font-variant-numeric:tabular-nums}
.sofs .d small{display:block;color:var(--muted)}
.sofs .i{min-width:0}
.sofs .i b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sofs .i span{font-size:12.5px;color:var(--muted)}
.sofs .q{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);vertical-align:2px;margin-left:6px}
.sofs li.act{background:var(--chip)}
.active-card{background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.active-card div{min-width:0;flex:1}
.active-card span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.active-card b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.active-card p{margin:0;font-size:13px;opacity:.85}
.hrows{display:flex;flex-direction:column;gap:6px}
.hrows .hr{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center}
.hrows input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;width:100%;min-width:0}
.gate{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:24px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.entries li input[type=datetime-local]{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 5px;font-size:12px;font-family:var(--f-mono);min-width:0;max-width:170px}
nav.tabs .in{grid-template-columns:repeat(6,1fr)}
nav.tabs button{font-size:11px;padding-inline:2px}
.who{border:0;border-radius:999px;background:rgba(255,255,255,.12);color:var(--navy-ink);padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis;min-height:34px}
.who{margin-left:auto}
.who:not([hidden])+.clock{margin-left:0}
.who.none{background:var(--accent);color:var(--accent-ink)}
.tbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tbar button{border:0;border-radius:999px;padding:7px 12px;background:var(--chip);font-size:13.5px;font-weight:500;white-space:nowrap;min-height:36px}
.tbar button.on{background:var(--navy);color:var(--navy-ink)}
.tallies{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tcard{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard header{display:flex;align-items:baseline;gap:8px}
.tcard header b{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcount{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tcount small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-left:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.steps span{font-size:12px;color:var(--muted);margin-right:2px}
.steps button{border:0;border-radius:8px;min-width:42px;min-height:38px;padding:0 10px;background:var(--chip);font-family:var(--f-mono);font-weight:600;font-size:15px}
.steps button.on{background:var(--navy);color:var(--navy-ink)}
.tplus small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;opacity:.75;letter-spacing:0}
.tplus{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:30px;min-height:72px;width:100%;transition:transform .08s}
.tplus:active{transform:scale(.97)}
.tline{display:grid;grid-template-columns:auto 1fr auto;gap:6px}
.tline input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px;min-width:0;width:100%}
.byuser{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.byuser b{color:var(--ink);font-family:var(--f-mono)}
.mstat{width:100%;border-collapse:collapse;font-size:13.5px}
.mstat th,.mstat td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.mstat th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mstat td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{border:0;border-radius:10px;background:var(--chip);padding:12px 14px;text-align:left;font-size:15px;display:flex;justify-content:space-between;gap:10px;min-height:48px}
.pick button.on{background:var(--navy);color:var(--navy-ink)}
.pick button span{opacity:.7;font-size:13px}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .box{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.login .logo{font-family:var(--f-display);font-weight:700;font-size:40px;letter-spacing:.05em;text-transform:uppercase;line-height:1;color:var(--ink)}
.login .logo small{display:block;font-family:var(--f-body);font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:6px}
.lcard{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lcard h3{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;margin:0}
.err{color:var(--bad);font-size:13.5px;margin:0}
.rcode{font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:.08em;text-align:center;background:var(--chip);border-radius:8px;padding:14px 8px;user-select:all}
.pwin{border:1px dashed var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px;width:100%;margin-bottom:6px}
.lk{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:13.5px;padding:6px 0;align-self:center}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0;flex:1;overflow:hidden}
.brandwrap .brand{min-width:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandwrap .brand small{max-width:none}
.who{flex:none;max-width:30vw!important}
.clock b{font-size:19px!important}
.brandwrap img{width:36px;height:36px;border-radius:9px;flex:none}
.login .logo img{width:84px;height:84px;border-radius:20px;display:block;margin-bottom:12px;box-shadow:0 6px 20px rgba(4,44,100,.3)}
.install{display:flex;gap:10px;align-items:center;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:12px 14px;font-size:14px}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install div{flex:1;min-width:0}
.sheet-bg{z-index:60!important}
.toast{z-index:70!important}
.tallyhead{background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.tallyhead .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:600}
.tallyhead .ttl{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;line-height:1.1;text-transform:uppercase}
.tallyhead .meta{font-size:13.5px;opacity:.9;display:flex;flex-wrap:wrap;gap:4px 12px}
.tallyhead .meta b{font-weight:600}
.tallyhead .row .btn{flex:1}
.tallyhead .btn.ghost{color:var(--navy-ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.who[data-sync]::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:1px;background:var(--ok)}
.who[data-sync="busy"]::after{background:var(--accent)}.who[data-sync="off"]::after{background:var(--muted)}.who[data-sync="err"]::after{background:var(--bad)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px;margin-bottom:12px}
</style>


</head>

/* ---------- storage ---------- */
const DBN="sof-defteri",ST="kv";let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function load(){return new Promise(res=>{
  if(db){try{const q=db.transaction(ST).objectStore(ST).get("state");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);return}catch(e){}}
  try{res(JSON.parse(localStorage.getItem("sof-state")||"null"))}catch(e){res(null)}
})}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  const v=JSON.parse(JSON.stringify(R));
  if(db){try{db.transaction(ST,"readwrite").objectStore(ST).put(v,"state");return}catch(e){}}

},250);try{if(online())schedulePush()}catch(e){}}

/* ---------- model ---------- */
// R = { vessels:[{id,name,imo,flag,holds:[{id,name,cap}]}], sofs:[{id,vesselId,created,voyage,events,holds,entries}], cur, example }
const blankRoot=()=>({vessels:[],sofs:[],cur:null,example:false,who:{}});
const blankVoy=()=>({title:"",voyNo:"",port:"",berth:"",cargo:"",op:"Loading",qty:"",master:"",agent:"",charterer:""});
const DEF_TALLY=["Kamyon","Vagon","Kepçe (grab)"];
function newVessel(name,n){return{id:uid(),name:name||"",imo:"",flag:"",members:[],holds:Array.from({length:n||5},(_,i)=>({id:uid(),name:"Ambar "+(i+1),cap:""}))}}
function newSof(v,voy){
  const prev=R.sofs.filter(x=>x.vesselId===v.id&&x.tallies&&x.tallies.length).sort((a,b)=>b.created-a.created)[0];
  return{id:uid(),vesselId:v.id,created:Date.now(),voyage:Object.assign(blankVoy(),voy||{}),events:[],
  holds:v.holds.map(h=>({id:uid(),name:h.name,plan:0})),entries:[],
  tallies:(prev?prev.tallies.map(t=>t.name):DEF_TALLY).map(n=>({id:uid(),name:n,unitW:""})),tallyEntries:[]}}
function normalize(r){r.who=r.who||{};
  r.vessels.forEach(v=>{v.members=v.members||[];v.holds=v.holds||[]});
  r.sofs.forEach(s=>{s.tallies=s.tallies||DEF_TALLY.map(n=>({id:uid(),name:n,unitW:""}));s.tallyEntries=s.tallyEntries||[];s.entries=s.entries||[];s.events=s.events||[]});
  return r}
function migrate(d){const m=migrate0(d);return m?normalize(m):null}
function migrate0(d){
  if(!d)return null;
  if(d.vessels)return Object.assign(blankRoot(),d);
  if(d.events){ // v1 single-SOF format
    const v=newVessel((d.voyage&&d.voyage.vessel)||"Gemi",0);
    v.holds=(d.holds||[]).map(h=>({id:uid(),name:h.name,cap:""}));
    const s={id:uid(),vesselId:v.id,created:Date.now(),voyage:Object.assign(blankVoy(),d.voyage||{}),events:d.events||[],holds:d.holds||[],entries:d.entries||[]};
    delete s.voyage.vessel;
    return{vessels:[v],sofs:[s],cur:s.id,example:!!d.example};
  }
  return null;
}
function sample(){
  const r=blankRoot();r.example=true;
  const v=newVessel("MV Örnek Yıldız",5);v.imo="9000000";v.flag="Malta";
  v.members=[{id:uid(),name:"Mehmet K.",role:"Tallyman"},{id:uid(),name:"Ayşe T.",role:"Tallyman"},{id:uid(),name:"Kpt. A. Yılmaz",role:"Kaptan"}];
  const M=v.members.map(m=>m.id);
  r.vessels.push(v);r.who[v.id]=M[0];
  const mk=(daysAgo,voy,evs,plans,done)=>{
    const s=newSof(v,voy);const base=new Date();base.setDate(base.getDate()-daysAgo);base.setHours(5,40,0,0);
    const at=(h,m)=>base.getTime()+(h*60+m)*60000;s.created=at(0,0);
    evs.forEach(([l,h,m,n],i)=>s.events.push({id:uid(),t:at(h,m),label:l,note:n||"",photos:[],by:M[i<4?2:i%2]}));
    s.holds.forEach((h,i)=>{h.plan=plans[i];(done[i]||[]).forEach((q,j)=>s.entries.push({id:uid(),holdId:h.id,qty:q,t:at(8+j*4+i,10),by:M[(i+j)%2]}))});
    s.tallies.forEach((t,ti)=>{for(let k=0;k<[14,0,9][ti];k++)s.tallyEntries.push({id:uid(),tallyId:t.id,qty:ti===0&&k%5===0?3:1,t:at(7+k,ti*7),by:M[k%3===0?1:0],holdId:s.holds[k%s.holds.length].id})});
    r.sofs.push(s);return s;
  };
  mk(41,{voyNo:"V-2609",port:"Tekirdağ",berth:"Ceyport",cargo:"Mısır (dökme)",op:"Discharging",qty:"18500"},
    [["All Fast",2,0],["NOR Tendered",2,20],["Free Pratique Granted",3,0],["Initial Draft Survey Completed",4,30],["Commenced Discharging",5,10],["Completed Discharging",52,40],["Final Draft Survey Completed",54,0],["Let Go Last Line",56,15]],
    [3800,3700,3600,3700,3700],[[3800],[3700],[3600],[3700],[3700]]);
  const cur=mk(1,{voyNo:"V-2614",port:"Gemlik",berth:"Rıhtım 3",cargo:"Buğday (dökme)",op:"Loading",qty:"25000",master:"Kpt. A. Yılmaz",agent:"Örnek Acentelik"},
    [["EOSP (End of Sea Passage)",0,0],["NOR Tendered",0,20,"NOR acenteye e-posta ile iletildi"],["Pilot On Board (In)",2,10],["All Fast",3,35,"İskele tarafı, 4+4 halat"],["Free Pratique Granted",3,50],["Holds Passed",4,50,"Tüm ambarlar temiz ve kuru"],["Initial Draft Survey Completed",6,15],["Commenced Loading",6,40],["Rain Stop",11,20,"Ambar kapakları kapatıldı"],["Rain Stop Ended",12,45],["Resumed",12,55]],
    [5200,5000,4800,5000,5000],[[2100,1800],[2400,1500],[1600],[2000,900],[1200]]);
  r.cur=cur.id;return r;
}
let R=blankRoot();
const cur=()=>R.sofs.find(s=>s.id===R.cur)||null;
const vesselOf=s=>s?R.vessels.find(v=>v.id===s.vesselId)||{name:"?",holds:[],members:[]}:null;
let SES=null; // {role:"cap"|"staff", id}
const isCap=()=>!!(SES&&SES.role==="cap");
const me=()=>SES?(SES.role==="cap"?"cap":SES.id):null;
const capName=()=>(SES&&SES.online&&SES.role==="cap"&&SES.name)||(R.auth&&R.auth.name)||"Kaptan";
function mName(v,id){if(id==="cap")return capName();const m=(v.members||[]).find(x=>x.id===id);return m?m.name:"Belirtilmemiş"}
// per-member totals for one SOF: {id:{ev,mt,tally:{tallyId:qty},n}}
function memberStats(s){const o={};const g=id=>o[id||""]||(o[id||""]={ev:0,mt:0,tally:{},n:0});
  s.events.forEach(e=>{const x=g(e.by);x.ev++;x.n++});
  s.entries.forEach(e=>{const x=g(e.by);x.mt+=+e.qty||0;x.n++});
  s.tallyEntries.forEach(e=>{const x=g(e.by);x.tally[e.tallyId]=(x.tally[e.tallyId]||0)+(+e.qty||0);x.n++});
  return o}

/* ---------- formatting ---------- */
const DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const DAYS_EN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const p2=n=>String(n).padStart(2,"0");
const fT=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())};
const fD=t=>{const d=new Date(t);return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear()};
const fDay=t=>DAYS[new Date(t).getDay()];
const fLocalInput=t=>{const d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+"T"+p2(d.getHours())+":"+p2(d.getMinutes())};
const num=n=>(Math.round(n*1000)/1000).toLocaleString("tr-TR",{maximumFractionDigits:3});
const sorted=s=>s.events.slice().sort((a,b)=>a.t-b.t);
const span=s=>{const e=sorted(s);return e.length?[e[0].t,e[e.length-1].t]:[s.created,s.created]};
const loadedOf=(s,hid)=>s.entries.filter(x=>x.holdId===hid).reduce((a,b)=>a+(+b.qty||0),0);
const totals=s=>{const p=s.holds.reduce((a,h)=>a+(+h.plan||0),0),d=s.holds.reduce((a,h)=>a+loadedOf(s,h.id),0);return{p,d}};

      <div class="row"><input id="nmN" placeholder="Yeni üye adı" style="flex:2;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px"><input id="nmR" placeholder="Görev (Tallyman…)" style="flex:1.4;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px"><button class="btn pri" id="nmAdd">Ekle</button></div>

/* member statistics: who entered how much, per SOF and all-time for the vessel */
function membersSheet(vid){const v=R.vessels.find(x=>x.id===vid);const host=$("#sheetHost");
  const sofs=R.sofs.filter(x=>x.vesselId===vid).sort((a,b)=>span(b)[0]-span(a)[0]);
  let sel=(cur()&&cur().vesselId===vid)?cur().id:(sofs[0]?sofs[0].id:"all");
  const draw=()=>{
    const list=sel==="all"?sofs:sofs.filter(x=>x.id===sel);
    // aggregate across chosen SOFs; tally aggregated by counter name
    const agg={},tnames=new Set();
    list.forEach(s=>{const ms=memberStats(s);Object.entries(ms).forEach(([id,x])=>{const a=agg[id]||(agg[id]={ev:0,mt:0,tally:{},n:0});
      a.ev+=x.ev;a.mt+=x.mt;a.n+=x.n;Object.entries(x.tally).forEach(([tid,q])=>{const t=s.tallies.find(y=>y.id===tid);const nm=t?t.name:"?";tnames.add(nm);a.tally[nm]=(a.tally[nm]||0)+q})})});
    const tn=[...tnames];
    const ids=[...v.members.map(m=>m.id),...Object.keys(agg).filter(k=>!v.members.some(m=>m.id===k))];
    const rows=ids.filter(id=>agg[id]||v.members.some(m=>m.id===id));
    const sum=k=>rows.reduce((a,id)=>a+((agg[id]||{})[k]||0),0);
    host.innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="Üyeler">
      <h3>Üyeler · ${esc(v.name)}</h3>
      <label class="field">Dönem<select id="mSel"><option value="all"${sel==="all"?" selected":""}>Tüm SOF’lar (${sofs.length})</option>${sofs.map(s=>`<option value="${s.id}"${s.id===sel?" selected":""}>${fD(span(s)[0])} · ${esc(s.voyage.port||"Liman yok")}</option>`).join("")}</select></label>
      <div class="tw"><table class="mstat"><thead><tr><th>Üye</th><th style="text-align:right">Olay</th><th style="text-align:right">Ambar MT</th>${tn.map(n=>`<th style="text-align:right">${esc(n)}</th>`).join("")}</tr></thead><tbody>
      ${rows.map(id=>{const a=agg[id]||{ev:0,mt:0,tally:{}};const m=v.members.find(x=>x.id===id);
        return `<tr><td>${esc(m?m.name:(id==="cap"?capName():id?"Silinmiş üye":"Belirtilmemiş"))}${m&&m.role?`<br><span style="color:var(--muted);font-size:12px">${esc(m.role)}</span>`:""}</td><td class="n">${a.ev}</td><td class="n">${num(a.mt)}</td>${tn.map(n=>`<td class="n">${num(a.tally[n]||0)}</td>`).join("")}</tr>`}).join("")||`<tr><td colspan="3" style="color:var(--muted)">Kayıt yok</td></tr>`}
      ${rows.length?`<tr><th>Toplam</th><th style="text-align:right">${sum("ev")}</th><th style="text-align:right">${num(sum("mt"))}</th>${tn.map(n=>`<th style="text-align:right">${num(rows.reduce((a,id)=>a+(((agg[id]||{}).tally||{})[n]||0),0))}</th>`).join("")}</tr>`:""}
      </tbody></table></div>
      <h2 style="margin:6px 0 0">Üye listesi</h2>
      <div class="hrows">${v.members.map((m,i)=>`<div class="hr"><input data-mn="${i}" value="${esc(m.name)}" aria-label="Ad"><input data-mr="${i}" value="${esc(m.role||"")}" placeholder="Görev" aria-label="Görev"><button class="x" data-mx="${i}" aria-label="Üyeyi çıkar">×</button></div>${online()?(m.account?`<div class="note" style="margin:0 0 8px">🔐 Giriş: <b>${esc(m.account)}</b> <button class="lk" data-acre="${i}" style="padding:0 6px">Yeni hesap aç</button></div>`

/* ---------- photo compression ---------- */
function compress(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const M=1280,sc=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.7))};img.src=r.result};r.readAsDataURL(file)})}

const sofTitle=s=>(s.voyage.title||"").trim()||[s.voyage.port,s.voyage.cargo].filter(Boolean).join(" · ")||"Adsız SOF";
const sofLabel=s=>`${vesselOf(s).name} · ${sofTitle(s)} · ${fD(span(s)[0])}`;

    <span class="ttl">${esc(sofTitle(s))}</span>
    <div class="meta"><span>🚢 <b>${esc(v.name)}</b></span>${s.voyage.port?`<span>⚓ ${esc(s.voyage.port)}${s.voyage.berth?" / "+esc(s.voyage.berth):""}</span>`:""}<span>${op}</span>${s.voyage.voyNo?`<span>Sefer ${esc(s.voyage.voyNo)}</span>`:""}<span>Başlangıç ${fD(span(s)[0])}</span></div>
    ${isCap()?"":`<div class="meta"><span>${esc(mName(v,me()))} · bu tally’de ${mineN} kaydınız var</span></div>
    ${online()?"":`<div class="row"><button class="btn pri" id="${sendId}">Kayıtlarımı gönder</button><button class="btn ghost" data-newpack>Yeni liman / paket al</button></div>`}`}
    ${online()?`<div class="row" style="align-items:center"><span data-syncline style="flex:1;min-width:0;font-size:13.5px">${esc(syncText())}</span><button class="btn sm ghost" data-syncnow>Şimdi eşitle</button></div>`:""}</div>`}
function wireHead(sendId){const b=$("#"+sendId);if(b)b.onclick=()=>sendSheet();$$("[data-syncnow]").forEach(x=>x.onclick=()=>{SY.err="";pushNow();updateSyncUI()});$$("[data-newpack]").forEach(x=>x.onclick=()=>staffNewPack())}
function staffNewPack(){const host=$("#sheetHost");const use=o=>{if(o.k!=="pack")throw{msg:"Bu bir personel kaydı, paket değil. Kaptanın Rapor → Personel paketi hazırla ekranındaki kodu kullanın."};staffConfirmPack(o)};

  $("#npL").onclick=()=>{try{use(dec($("#npIn").value))}catch(e){const x=$("#npE");x.hidden=false;x.textContent=e&&e.msg?e.msg:"Kod okunamadı. Tamamını kopyaladığınızdan emin olun."}}}
// before switching to another SOF, remind staff to send what they recorded in the current one
function staffConfirmPack(o,after){const c=cur(),nsof=(o.data.sofs||[])[0],host=$("#sheetHost");

    <div class="banner" style="margin:0">Önceki tally’de (<b>${esc(sofTitle(c))}</b>) ${mine} kaydınız var. Kaptana gönderdiyseniz devam edin. Önceki kayıtlar silinmez; gerekirse hesabınızdan tekrar gönderebilirsiniz.</div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="npSend">Önce önceki kayıtları gönder</button><button class="btn pri" id="npGo">Gönderdim, devam et</button></div></div></div>`;
  $("#npSend").onclick=()=>sendSheet(c);$("#npGo").onclick=go}
const tHold={}; // selected hold per SOF (in-memory)
const stepOf=tid=>{const v=R.steps&&R.steps[tid];return v>0?v:1};
const setStep=(tid,n)=>{R.steps=R.steps||{};R.steps[tid]=n;save()};
const tallyOf=(s,tid,hid)=>s.tallyEntries.filter(x=>x.tallyId===tid&&(!hid||x.holdId===hid)).reduce((a,b)=>a+(+b.qty||0),0);
function renderTally(){const s=cur();

    ${headCard(s,"tSend")}
    <div class="tbar" role="tablist" aria-label="Ambar"><button data-th="" class="${hid?"":"on"}">Ambarsız</button>${s.holds.map(h=>`<button data-th="${h.id}" class="${h.id===hid?"on":""}">${esc(h.name)}</button>`).join("")}</div>
    <div class="tallies">${s.tallies.map(t=>{const tot=tallyOf(s,t.id),inH=hid?tallyOf(s,t.id,hid):null;
      const per={};s.tallyEntries.filter(x=>x.tallyId===t.id).forEach(x=>per[x.by||""]=(per[x.by||""]||0)+(+x.qty||0));
      const ents=s.tallyEntries.filter(x=>x.tallyId===t.id).sort((a,b)=>b.t-a.t);

        <div class="tcount">${num(tot)}<small>adet${uw?` · ≈ ${num(tot*uw)} MT`:""}</small></div>
        ${hid?`<div class="note" style="margin:-4px 0 0">${esc((s.holds.find(h=>h.id===hid)||{}).name)}: <b class="mono" style="color:var(--ink)">${num(inH)}</b> adet</div>`:""}
        ${(()=>{const st=stepOf(t.id),pre=[1,2,4,5,6,8,10,12];return `<div class="steps" role="group" aria-label="Her basışta"><span>Her basışta</span>${pre.map(n=>`<button data-st="${n}" class="${st===n?"on":""}">${n}</button>`).join("")}<button data-st="x" class="${pre.includes(st)?"":"on"}">${pre.includes(st)?"Diğer":num(st)}</button></div>
        <button class="tplus" data-tp>+${num(st)}${st>1?`<small>bir basış = ${num(st)} adet</small>`:""}</button>`})()}
        <div class="tline"><button class="btn ghost" data-tun title="Son kaydı geri al">Geri al</button><input type="number" inputmode="numeric" step="any" placeholder="Adet gir" data-tq aria-label="Adet"><button class="btn pri" data-tadd>Ekle</button></div>
        <div class="byuser">${Object.keys(per).length?Object.entries(per).map(([id,q])=>`<span>${esc(mName(v,id))}: <b>${num(q)}</b></span>`).join(""):"Henüz sayım yok"}</div>
        <details class="entries"${ents.length?"":" hidden"}><summary>${ents.length} kayıt</summary><ul>${ents.slice(0,60).map(x=>`<li><span class="mono">${fD(x.t).slice(0,5)} ${fT(x.t)}</span><span style="color:var(--muted);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(mName(v,x.by))}${x.holdId?" · "+esc((s.holds.find(h=>h.id===x.holdId)||{name:""}).name):""}</span><b>${num(+x.qty)}</b>${isCap()||x.by===who?`<button class="x" data-tdel="${x.id}" aria-label="Kaydı sil">×</button>`:""}</li>`).join("")}</ul></details>
      </div>`}).join("")}</div>
    ${isCap()?"":"<!--"}<div class="row" style="margin-top:12px"><input id="tNew" placeholder="Yeni sayaç (örn. Big bag, Palet, Konteyner)" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px"><button class="btn pri" id="tNewBtn">+ Sayaç ekle</button></div>${isCap()?"":"-->"}`;
  wireHead("tSend");
  $$("[data-th]").forEach(b=>b.onclick=()=>{tHold[s.id]=b.dataset.th;renderTally()});
  const addT=()=>{const n=$("#tNew").value.trim();if(!n)return $("#tNew").focus();s.tallies.push({id:uid(),name:n,unitW:""});save();renderTally()};
  if(isCap()){$("#tNewBtn").onclick=addT;$("#tNew").onkeydown=e=>{if(e.key==="Enter")addT()}}
  $$(".tcard").forEach(el=>{const t=s.tallies.find(x=>x.id===el.dataset.t);
    const push=q=>{s.tallyEntries.push({id:uid(),tallyId:t.id,qty:q,t:Date.now(),by:me(),holdId:hid||null});save();renderTally();

    const q=el.querySelector("[data-tq]");

    el.querySelector("[data-tadd]").onclick=add;q.onkeydown=e=>{if(e.key==="Enter")add()};
    el.querySelector("[data-tun]").onclick=()=>{const mine=s.tallyEntries.filter(x=>x.tallyId===t.id&&(x.by||null)===me()).sort((a,b)=>b.t-a.t)[0];
      if(!mine)return toast("Geri alınacak kaydınız yok");s.tallyEntries=s.tallyEntries.filter(x=>x!==mine);save();renderTally();toast(`${esc(t.name)}: son kayıt (${num(mine.qty)}) geri alındı`)};

      s.tallyEntries=s.tallyEntries.filter(x=>x.id!==b.dataset.tdel);save();renderTally()});

/* ---------- HOLDS ---------- */
function renderHolds(){const s=cur();
  if(!s){$("#holdWrap").innerHTML=gate();wireGate();return}
  const {p:plan,d:done}=totals(s),rem=plan-done,pct=plan?Math.min(100,done/plan*100):0;
  const verb=s.voyage.op==="Discharging"?"Tahliye":"Yüklenen";
  const vh=vesselOf(s).holds;
  $("#holdWrap").innerHTML=`<div class="sum"><div><span>Plan</span><b>${num(plan)}</b></div><div><span>${verb}</span><b>${num(done)}</b></div><div><span>Kalan</span><b>${num(rem)}</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="pct">%${pct.toFixed(1)} tamamlandı · metrik ton (MT) · ${esc(vesselOf(s).name)}</div></div>
    <div class="holds">${s.holds.map(h=>{const d=loadedOf(s,h.id),r=(+h.plan||0)-d,p=h.plan?d/h.plan*100:0;
      const cap=(vh.find(x=>x.name===h.name)||{}).cap;
      const ents=s.entries.filter(x=>x.holdId===h.id).sort((a,b)=>b.t-a.t);
      return `<div class="hold" data-h="${h.id}">
        <header><input value="${esc(h.name)}" data-name aria-label="Ambar adı"><button class="x" data-delh title="Ambarı sil">×</button></header>
        <div class="hstats"><div>Plan<b>${num(+h.plan||0)}</b></div><div>${verb}<b>${num(d)}</b></div><div>Kalan<b style="color:${r<0?"var(--warn)":"inherit"}">${num(r)}</b></div></div>
        <div class="hbar${p>100?" over":""}"><i style="width:${Math.min(100,p)}%"></i></div>
        <label class="field">Plan miktarı (MT)${cap?` · kapasite ${esc(cap)}`:""}<input type="number" inputmode="decimal" step="any" min="0" value="${h.plan||""}" data-plan></label>
        <div class="addq"><input style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:15px;min-width:0;width:100%" type="number" inputmode="decimal" step="any" placeholder="Miktar (MT)" data-q aria-label="Eklenecek miktar"><button class="btn pri" data-add>+ Ekle</button></div>
        <details class="entries"${ents.length?"":" hidden"}><summary>${ents.length} kayıt · tarih düzeltilebilir</summary><ul>${ents.map(x=>`<li><input type="datetime-local" value="${fLocalInput(x.t)}" data-et="${x.id}" aria-label="Kayıt zamanı"><span style="color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${x.by?esc(mName(vesselOf(s),x.by)):""}</span><b>${num(+x.qty)}</b><button class="x" data-dele="${x.id}" aria-label="Kaydı sil">×</button></li>`).join("")}</ul></details>
      </div>`}).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="addHold">+ Ambar ekle</button>
    <span class="note">Plan miktarını girin, her yüklemede “Ekle” ile miktarı yazın; kalan otomatik hesaplanır.</span></div>`;
  $("#addHold").onclick=()=>{s.holds.push({id:uid(),name:"Ambar "+(s.holds.length+1),plan:0});save();renderHolds()};
  $$(".hold").forEach(el=>{const h=s.holds.find(x=>x.id===el.dataset.h);
    el.querySelector("[data-name]").onchange=ev=>{h.name=ev.target.value||h.name;save()};
    el.querySelector("[data-plan]").onchange=ev=>{h.plan=+ev.target.value||0;save();renderHolds()};
    const q=el.querySelector("[data-q]");
    const add=()=>{const v=parseFloat(String(q.value).replace(",","."));if(!v)return q.focus();s.entries.push({id:uid(),holdId:h.id,qty:v,t:Date.now(),by:me()});save();renderHolds();toast(`<span>${esc(h.name)}: <b>+${num(v)} MT</b></span>`)};
    el.querySelector("[data-add]").onclick=add;q.onkeydown=ev=>{if(ev.key==="Enter")add()};
    el.querySelectorAll("[data-et]").forEach(i=>i.onchange=()=>{const x=s.entries.find(y=>y.id===i.dataset.et);if(x&&i.value){x.t=new Date(i.value).getTime();save()}});
    el.querySelectorAll("[data-dele]").forEach(b=>b.onclick=()=>{if(b.dataset.c){s.entries=s.entries.filter(x=>x.id!==b.dataset.dele);save();renderHolds()}else{b.dataset.c=1;b.textContent="Sil?";b.style.color="var(--bad)";b.style.fontSize="13px"}});
    const dh=el.querySelector("[data-delh]");dh.onclick=()=>{if(dh.dataset.c){s.holds=s.holds.filter(x=>x.id!==h.id);s.entries=s.entries.filter(x=>x.holdId!==h.id);save();renderHolds()}else{dh.dataset.c=1;dh.textContent="Sil?";dh.style.color="var(--bad)";dh.style.fontSize="13px"}};
  });
}

/* ---------- crypto (offline SHA-256) ---------- */
function sha256(str){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)),K=[],H=[];
  const isP=n=>{for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
  for(let n=2,k=0;k<64;n++)if(isP(n)){if(k<8)H[k]=(Math.pow(n,.5)*4294967296)|0;K[k++]=(Math.pow(n,1/3)*4294967296)|0}
  const b=new TextEncoder().encode(str),l=b.length,bl=((l+9+63)>>6)<<6,m=new Uint8Array(bl);m.set(b);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(bl-4,(l*8)>>>0);dv.setUint32(bl-8,Math.floor(l*8/4294967296));
  const w=new Array(64);
  for(let o=0;o<bl;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))|0}
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}

/* ---------- QR encoder (byte mode, EC L/M) ---------- */
const QRGEN=(()=>{
  const ECC={L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],

             M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FMT={L:1,M:0};

  const dataCw=(v,e)=>Math.floor(raw(v)/8)-ECC[e][v]*BLK[e][v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255};
  function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function rsRem(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r}
  function alignPos(v){if(v===1)return[];const n=Math.floor(v/7)+2,size=v*4+17;const step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2;const r=[6];for(let p=size-7;r.length<n;p-=step)r.splice(1,0,p);return r}
  function encode(text,ecl){
    ecl=ecl||"L";const bytes=Array.from(new TextEncoder().encode(text));
    let ver=0;for(let v=1;v<=40;v++){const cc=v<=9?8:16;if(4+cc+bytes.length*8<=dataCw(v,ecl)*8){ver=v;break}}
    if(!ver)throw new Error("QR için veri çok büyük");
    const bits=[];const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,ver<=9?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCw(ver,ecl)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);

    const blocks=[];for(let i=0,k=0;i<nb;i++){const len=sl-el+(i<ns?0:1);const d=data.slice(k,k+len);k+=len;const e=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(e))}

async function onlineLogout(){stopSync();try{await FB.au.signOut(FB.auth)}catch(e){}SES=null;saveSes();$("#sheetHost").innerHTML="";renderLogin()}

/* ---- listeners ---- */
function stopSync(){SY.unsubs.forEach(f=>{try{f()}catch(e){}});SY.unsubs=[];stopActive();clearTimeout(SY.pushT)}
function stopActive(){(SY.activeUnsubs||[]).forEach(f=>{try{f()}catch(e){}});SY.activeUnsubs=[];SY.activeSub=null}
function startSync(){stopSync();const {fs}=FB;applyNet();
  SY.unsubs.push(fs.onSnapshot(fpath("state","vessels"),sn=>applyVessels(sn),e=>syncErr(e)));
  if(isCap())SY.unsubs.push(fs.onSnapshot(fcol("sofs"),qs=>applySofs(qs),e=>syncErr(e)));
  subscribeActive();schedulePush(3000);updateSyncUI()}
function syncErr(e){SY.err=authMsg(e);updateSyncUI()}
function subscribeActive(){if(!online())return;const sid=R.cur;if(SY.activeSub===sid)return;stopActive();SY.activeSub=sid;if(!sid)return;const {fs}=FB;
  if(isCap()){
    SY.activeUnsubs.push(fs.onSnapshot(fcol("sofs",sid,"events"),qs=>applyEvents(qs,sid),e=>syncErr(e)));
    SY.activeUnsubs.push(fs.onSnapshot(fcol("sofs",sid,"tally"),qs=>applyTally(qs,sid),e=>syncErr(e)));
  }else{
    SY.activeUnsubs.push(fs.onSnapshot(fpath("sofs",sid),sn=>applySofDoc(sn,sid),e=>syncErr(e)));
    staffFetchOwn(sid);
  }}
function applyVessels(sn){if(!sn.exists())return;const list=(sn.data().list)||[];const S=SYN();
  if(!isCap()){const prev=R.cur;R.vessels=list.map(v=>Object.assign({},v));
    const mv=R.vessels.find(v=>(v.members||[]).some(m=>m.id===SES.id));
    if(mv&&mv.activeSof&&mv.activeSof!==R.cur){
      if(!sofById(mv.activeSof))R.sofs.push(normalizeSof({id:mv.activeSof,vesselId:mv.id,created:Date.now(),voyage:blankVoy(),holds:[],tallies:[],entries:[],events:[],tallyEntries:[]}));
      R.cur=mv.activeSof;if(prev)setTimeout(()=>toast("Kaptan yeni bir tally açtı. Kayıtlarınız artık yeni tally’ye gidiyor."),300)}
    save();renderHeader();renderTab();return}
  const rem={};list.forEach(v=>rem[v.id]=v);const out=[];
  R.vessels.forEach(lv=>{const syn=S.vh[lv.id],lh=hsh(vPay(lv)),pend=syn!==lh;
    if(rem[lv.id]){const rv=rem[lv.id],rh=hsh(vPay(rv));
      if(pend&&lh!==rh)out.push(lv);
      else{const pw={};(lv.members||[]).forEach(m=>{if(m.pw)pw[m.id]=m.pw});
        const nv=Object.assign({},rv,{members:(rv.members||[]).map(m=>Object.assign({},m,pw[m.id]?{pw:pw[m.id]}:{}))});out.push(nv);S.vh[lv.id]=hsh(vPay(nv))}
      delete rem[lv.id]}
    else if(syn!==undefined&&!pend){delete S.vh[lv.id]}
    else out.push(lv)});
  Object.values(rem).forEach(rv=>{out.push(Object.assign({},rv));S.vh[rv.id]=hsh(vPay(rv))});
  R.vessels=out;save();renderHeader();renderTab()}
function normalizeSof(s){s.voyage=Object.assign(blankVoy(),s.voyage||{});s.holds=s.holds||[];s.tallies=s.tallies||[];s.entries=s.entries||[];s.events=s.events||[];s.tallyEntries=s.tallyEntries||[];return s}
function applySofs(qs){const S=SYN();let ch=false;
  qs.docChanges().forEach(c=>{const id=c.doc.id,l=sofById(id);
    if(c.type==="removed"){if(l&&S.sof[id]===hsh(metaOf(l))){R.sofs=R.sofs.filter(x=>x.id!==id);delete S.sof[id];if(R.cur===id)R.cur=null;ch=true}return}
    const m=c.doc.data();
    if(!l){R.sofs.push(normalizeSof(Object.assign({id},m,{events:[],tallyEntries:[]})));S.sof[id]=hsh(metaOf(sofById(id)));ch=true}
    else if(S.sof[id]===hsh(metaOf(l))||S.sof[id]===undefined&&hsh(metaOf(l))===hsh(clean(m))){Object.assign(l,m);normalizeSof(l);S.sof[id]=hsh(metaOf(l));ch=true}});
  if(ch){save();renderHeader();renderTab()}}
function applySofDoc(sn,sid){const S=SYN();if(!sn.exists()){toast("Bu tally kaptan tarafından silinmiş.");return}
  let l=sofById(sid);const m=sn.data();if(!l){l=normalizeSof(Object.assign({id:sid},m,{events:[],tallyEntries:[]}));R.sofs.push(l)}else{Object.assign(l,m);normalizeSof(l)}
  S.seen[sid]=true;save();renderHeader();renderTab()}
function applyEvents(qs,sid){const s=sofById(sid);if(!s)return;const S=SYN(),syn=S.ev[sid]||(S.ev[sid]={});
  const rem={};qs.forEach(d=>rem[d.id]=d.data());const loc={};s.events.forEach(e=>loc[e.id]=e);const out=[];
  Object.keys(rem).forEach(id=>{const r=rem[id],l=loc[id];
    if(!l&&syn[id]!==undefined)return;                       // deleted here, delete not sent yet
    if(l&&syn[id]!==evHash(l)&&(syn[id]!==undefined||evHash(l)!==hsh(evPay(r)))){out.push(l);return} // local edit pending
    out.push(Object.assign({},r,{id,photos:l?l.photos:[]}));syn[id]=hsh(evPay(r))});
  Object.keys(loc).forEach(id=>{if(rem[id])return;if(syn[id]!==undefined&&syn[id]===evHash(loc[id])){delete syn[id];return}out.push(loc[id])});
  s.events=out;save();renderTab()}
const unpack=c=>({id:c.i,tallyId:c.k,holdId:c.h||null,qty:c.q,t:c.t,by:c.b});
function remoteTally(docs){const adds=new Map(),dels=new Set();docs.sort((a,b)=>(a.at||0)-(b.at||0)).forEach(d=>{(d.add||[]).forEach(c=>adds.set(c.i,unpack(c)));(d.del||[]).forEach(i=>dels.add(i))});
  return[...adds.values()].filter(x=>!dels.has(x.id))}
function applyTally(qs,sid){const s=sofById(sid);if(!s)return;const S=SYN(),te=S.te[sid]||{};
  const docs=[];qs.forEach(d=>docs.push(d.data()));
  const localIds=new Set(s.tallyEntries.map(x=>x.id));const pendDel=new Set(Object.keys(te).filter(id=>!localIds.has(id)));
  const pendAdd=s.tallyEntries.filter(x=>!(x.id in te));const remote=remoteTally(docs);const nte={};remote.forEach(x=>nte[x.id]=x.by);
  s.tallyEntries=remote.filter(x=>!pendDel.has(x.id)).concat(pendAdd.filter(x=>!(x.id in nte)));S.te[sid]=nte;save();renderTab()}
async function staffFetchOwn(sid){if(!online())return;const {fs}=FB;const S=SYN();
  try{const me_=me();
    const [eq,tq]=await Promise.all([fs.getDocs(fs.query(fcol("sofs",sid,"events"),fs.where("by","==",me_))),fs.getDocs(fs.query(fcol("sofs",sid,"tally"),fs.where("by","==",me_)))]);
    const s=sofById(sid);if(!s)return;
    const syn=S.ev[sid]||(S.ev[sid]={});const loc={};s.events.forEach(e=>loc[e.id]=e);
    eq.forEach(d=>{const r=d.data();if(!loc[d.id]&&syn[d.id]===undefined){s.events.push(Object.assign({},r,{id:d.id,photos:[]}));syn[d.id]=hsh(evPay(r))}else if(loc[d.id]&&syn[d.id]===undefined&&evHash(loc[d.id])===hsh(evPay(r)))syn[d.id]=hsh(evPay(r))});
    const te=S.te[sid]||(S.te[sid]={});const docs=[];tq.forEach(d=>docs.push(d.data()));const remote=remoteTally(docs);
    const localIds=new Set(s.tallyEntries.map(x=>x.id));
    remote.forEach(x=>{if(!localIds.has(x.id)&&!(x.id in te)){s.tallyEntries.push(x)}te[x.id]=x.by});
    save();renderTab()}catch(e){syncErr(e)}}

/* ---- push (batched) ---- */
function schedulePush(ms){if(!online())return;if(ms==null&&SY.pushT){updateSyncUI();return}clearTimeout(SY.pushT);SY.pushT=setTimeout(()=>{SY.pushT=null;pushNow()},ms==null?(isCap()?8000:15000):ms);updateSyncUI()}
async function pushNow(){if(!online()||SY.pushing)return;if(isCap()&&!SYN().migrated)return;SY.pushing=true;const {fs}=FB;const S=SYN();const ops=[],revert=[];
  try{
    const mine=x=>isCap()||x.by===me();
    if(isCap()){
      const vids=new Set(R.vessels.map(v=>v.id));const vPend=R.vessels.some(v=>S.vh[v.id]!==hsh(vPay(v)))||Object.keys(S.vh).some(id=>!vids.has(id));
      if(vPend){const data={list:R.vessels.map(vPay)};ops.push({t:"set",ref:fpath("state","vessels"),data});const old=Object.assign({},S.vh);revert.push(()=>S.vh=old);
        S.vh={};R.vessels.forEach(v=>S.vh[v.id]=hsh(vPay(v)))}
      R.sofs.forEach(s=>{const h=hsh(metaOf(s));if(S.sof[s.id]!==h){ops.push({t:"set",ref:fpath("sofs",s.id),data:metaOf(s)});const o=S.sof[s.id];revert.push(()=>S.sof[s.id]=o);S.sof[s.id]=h}});
      const sids=new Set(R.sofs.map(s=>s.id));Object.keys(S.sof).forEach(id=>{if(!sids.has(id)){ops.push({t:"del",ref:fpath("sofs",id)});delete S.sof[id]}});
    }
    R.sofs.forEach(s=>{if(!isCap()&&!S.seen[s.id])return;
      const syn=S.ev[s.id]||(S.ev[s.id]={});
      s.events.forEach(e=>{if(!mine(e))return;if(isCap()&&!e.by)e.by="cap";const h=evHash(e);
        if(syn[e.id]!==h){ops.push({t:"set",ref:fpath("sofs",s.id,"events",e.id),data:evPay(e)});const o=syn[e.id];revert.push(()=>syn[e.id]=o);syn[e.id]=h}});
      const eids=new Set(s.events.map(e=>e.id));Object.keys(syn).forEach(id=>{if(!eids.has(id)){ops.push({t:"del",ref:fpath("sofs",s.id,"events",id)});delete syn[id]}});
      const te=S.te[s.id]||(S.te[s.id]={});
      const adds=s.tallyEntries.filter(x=>!(x.id in te)&&mine(x));const lids=new Set(s.tallyEntries.map(x=>x.id));
      const dels=Object.keys(te).filter(id=>!lids.has(id)&&(isCap()||te[id]===me()));
      const groups={};adds.forEach(x=>{const b=x.by||me();(groups[b]=groups[b]||[]).push(x)});
      Object.keys(groups).forEach(b=>{const g=groups[b];for(let i=0;i<g.length;i+=400){const ch=g.slice(i,i+400);
        ops.push({t:"set",ref:FB.fs.doc(fcol("sofs",s.id,"tally")),data:{by:b,at:Date.now(),add:ch.map(x=>clean({i:x.id,k:x.tallyId,h:x.holdId||null,q:+x.qty,t:x.t,b:x.by||me()})),del:[]}});
        ch.forEach(x=>{te[x.id]=x.by||me();revert.push(()=>delete te[x.id])})}});
      if(dels.length){ops.push({t:"set",ref:FB.fs.doc(fcol("sofs",s.id,"tally")),data:{by:me(),at:Date.now(),add:[],del:dels}});dels.forEach(id=>{const o=te[id];delete te[id];revert.push(()=>te[id]=o)})}
    });
    if(ops.length){save();SY.awaiting=true;updateSyncUI();
      const commits=[];for(let i=0;i<ops.length;i+=450){const b=fs.writeBatch(FB.db);ops.slice(i,i+450).forEach(o=>{if(o.t==="set"){b.set(o.ref,clean(o.data));addBytes(o.data)}else b.delete(o.ref)});commits.push(b.commit())}
      Promise.all(commits).then(()=>{SY.awaiting=false;SY.last=Date.now();SY.err="";updateSyncUI()}).catch(e=>{revert.forEach(f=>f());save();SY.awaiting=false;syncErr(e)});
    }else{SY.last=SY.last||Date.now()}
  }catch(e){revert.forEach(f=>f());syncErr(e)}
  SY.pushing=false;updateSyncUI()}

/* ---- network + status ---- */
function applyNet(){if(!FB)return;try{SY.paused?FB.fs.disableNetwork(FB.db):FB.fs.enableNetwork(FB.db)}catch(e){}}
function pendingCount(){if(!online())return 0;const S=SYN();let n=0;const mine=x=>isCap()||x.by===me();
  R.sofs.forEach(s=>{if(!isCap()&&!S.seen[s.id])return;const te=S.te[s.id]||{},ev=S.ev[s.id]||{};
    s.tallyEntries.forEach(x=>{if(mine(x)&&!(x.id in te))n++});s.events.forEach(e=>{if(mine(e)&&ev[e.id]!==evHash(e))n++})});return n}
function syncText(){if(!online())return"";const n=pendingCount();
  if(SY.err)return"⚠ "+SY.err;
  if(SY.paused)return`⏸ Eşitleme duraklatıldı${n?` · ${n} kayıt bekliyor`:""}`;
  if(!navigator.onLine)return`○ İnternet yok · ${n?n+" kayıt bekliyor, bağlantı gelince gider":"kayıtlar telefonda güvende"}`;
  if(n||SY.awaiting)return`↻ Eşitleniyor${n?` · ${n} kayıt`:""}`;
  return`✓ Eşitlendi${SY.last?" · "+fT(SY.last):""}`}
function updateSyncUI(){const t=syncText();$$("[data-syncline]").forEach(e=>e.textContent=t);
  const wb=$("#whoBtn");if(wb&&online()){wb.dataset.sync=SY.err?"err":(SY.paused||!navigator.onLine)?"off":(pendingCount()||SY.awaiting)?"busy":"ok"}}
window.addEventListener("online",()=>{updateSyncUI();schedulePush(1500)});
window.addEventListener("offline",updateSyncUI);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&online())pushNow()});
setInterval(()=>{if(online())updateSyncUI()},30000);

async function createStaffAccount(v,m,user,pw){user=String(user||"").trim().toLowerCase();
  if(!/^[a-z0-9._-]{3,30}$/.test(user))throw{code:"x",message:"Kullanıcı adı en az 3 karakter olmalı; sadece harf (Türkçe karaktersiz), rakam, nokta, tire."};

      <div class="row"><button class="btn sm dark" id="aNow">Şimdi eşitle</button><label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="aPause"${SY.paused?" checked":""}> Eşitlemeyi duraklat</label></div></div>
    <div class="lcard" style="box-shadow:none;padding:0"><h3 style="font-size:16px">Şifremi değiştir</h3>
      <input type="password" id="aO" class="pwin" placeholder="Mevcut şifre" autocomplete="current-password"><input type="password" id="aN" class="pwin" placeholder="Yeni şifre (en az 6)" autocomplete="new-password">
      <p class="err" id="aE" hidden></p><button class="btn ghost" id="aS" style="align-self:flex-start">Şifreyi değiştir</button></div>
    ${cap?"":`<button class="btn ghost" id="aQR">İnternet yoksa: kayıtlarımı QR ile gönder</button>`}
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="aC">Kapat</button><button class="btn danger" id="aOut">Çıkış yap</button></div></div></div>`;
  $("#aC").onclick=()=>host.innerHTML="";
  $("#aOut").onclick=async()=>{const n=pendingCount();if(n&&!$("#aOut").dataset.c){$("#aOut").dataset.c=1;$("#aOut").textContent=`${n} kayıt henüz gönderilmedi. Yine de çık`;return}onlineLogout()};
  $("#aNow").onclick=()=>{SY.err="";if(SY.paused){SY.paused=false;try{localStorage.setItem("sof-paused","0")}catch(e){}applyNet();$("#aPause").checked=false}pushNow();if(isCap())stopActive();subscribeActive();updateSyncUI()};
  $("#aPause").onchange=e=>{SY.paused=e.target.checked;try{localStorage.setItem("sof-paused",SY.paused?"1":"0")}catch(x){}applyNet();updateSyncUI()};
  if(!cap)$("#aQR").onclick=()=>sendSheet();
  $("#aS").onclick=async()=>{const e=$("#aE");try{const u=FB.auth.currentUser;
      await FB.au.reauthenticateWithCredential(u,FB.au.EmailAuthProvider.credential(u.email,$("#aO").value));
      if($("#aN").value.length<6)throw{code:"auth/weak-password"};await FB.au.updatePassword(u,$("#aN").value);host.innerHTML="";toast("Şifre değiştirildi")}
    catch(x){e.hidden=false;e.textContent=authMsg(x)}}}

/* ---------- account ---------- */
function accountSheet(){if(online())return onlineAccountSheet();const host=$("#sheetHost");const cap=isCap();
  host.innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="Hesap"><h3>${esc(mName(vesselOf(cur())||{members:[]},me()))}</h3>
    <p class="note" style="margin:0">${cap?"Kaptan · tüm bölümlere erişim":"Personel · Olay Bas, Kayıt ve Tally"}</p>
    ${cap?`<div class="lcard" style="box-shadow:none;padding:0"><h3 style="font-size:16px">Kaptan şifresini değiştir</h3>
      <input type="password" id="aO" class="pwin" placeholder="Mevcut şifre" autocomplete="current-password"><input type="password" id="aN" class="pwin" placeholder="Yeni şifre (en az 4)" autocomplete="new-password">
      <p class="err" id="aE" hidden></p><button class="btn ghost" id="aS" style="align-self:flex-start">Şifreyi değiştir</button></div>`:`<button class="btn dark" id="aSend">Kayıtlarımı gönder</button><button class="btn ghost" data-newpack>Yeni liman / paket al</button>
      ${(()=>{const old=R.sofs.filter(x=>x.id!==R.cur&&(x.tallyEntries.some(e=>e.by===me())||x.events.some(e=>e.by===me()))).sort((a,b)=>b.created-a.created);
        return old.length?`<h2 style="margin:6px 0 0">Önceki tally’lerim</h2><div class="pick">${old.map(x=>`<button data-oldsend="${x.id}">${esc(sofTitle(x))} · ${fD(span(x)[0])}<span>Tekrar gönder</span></button>`).join("")}</div>`:""})()}`}
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="aC">Kapat</button><button class="btn danger" id="aOut">Çıkış yap</button></div></div></div>`;
  $("#aC").onclick=()=>host.innerHTML="";$("#aOut").onclick=logout;
  if(!cap){$("#aSend").onclick=()=>sendSheet();host.querySelectorAll("[data-newpack]").forEach(x=>x.onclick=()=>staffNewPack());
    host.querySelectorAll("[data-oldsend]").forEach(b=>b.onclick=()=>sendSheet(R.sofs.find(x=>x.id===b.dataset.oldsend)))}
  else $("#aS").onclick=()=>{const e=$("#aE");if(!checkPw(R.auth,$("#aO").value)){e.hidden=false;e.textContent="Mevcut şifre yanlış";return}
    if($("#aN").value.length<4){e.hidden=false;e.textContent="Yeni şifre en az 4 karakter olmalı";return}
    Object.assign(R.auth,mkPw($("#aN").value));save();host.innerHTML="";toast("Kaptan şifresi değiştirildi")}}

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(!$("#login").hidden)renderLogin()});

function installCard(){if(inFrame||standalone)return"";
  if(deferredInstall)return `<div class="install"><img src="${LOGO}" alt=""><div><b>Uygulamayı kur</b><br><span style="opacity:.8">Ana ekrana ikon olarak eklenir, internetsiz açılır.</span></div><button class="btn pri" id="instBtn">Kur</button></div>`;
  if(isIOS&&/^https:$/.test(location.protocol))return `<div class="install"><img src="${LOGO}" alt=""><div><b>iPhone’a kurmak için</b><br><span style="opacity:.85">Safari’de alttaki Paylaş düğmesine (□↑), sonra “Ana Ekrana Ekle”ye dokunun.</span></div></div>`;
  return ""}

function renderLocalLogin(){const L=$("#login");L.hidden=false;
  const head=`<div class="logo"><img src="${LOGO}" alt="">DG SOF Defteri<small>${R.auth?"Giriş yapın":"İlk kurulum"}</small></div>`;
  const loadCard=open=>`<details class="lcard"${open?" open":""}><summary style="cursor:pointer;font-weight:600">Kaptandan gelen kodu yükle</summary>
    <p class="note" style="margin:0">Personel telefonu için: kaptanın gönderdiği paketi yapıştırın veya dosyayı seçin.</p>
    <textarea class="copybox" id="lIn" placeholder="SOF:…" style="height:110px"></textarea><p class="err" id="lInE" hidden></p>
    <div class="row" style="justify-content:space-between"><label class="btn ghost" style="display:inline-flex;align-items:center">Dosya seç<input type="file" id="lF" accept=".txt,.json,text/plain,application/json" hidden></label><button class="btn dark" id="lLoad">Yükle</button></div></details>`;
  const scanCard=`<button class="btn dark" id="lScan" style="min-height:56px;font-size:16px">QR okut · kaptandan paket al</button>`;
  let body="";
  if(LV==="rec"&&REC){body=`<div class="lcard"><h3>Kurtarma kodunuz</h3><div class="rcode">${REC}</div>
    <p class="note" style="margin:0">Kaptan şifresini unutursanız bu kodla yenileyebilirsiniz. Bir yere yazın; bir daha gösterilmeyecek.</p><button class="btn pri" id="lRecOk">Yazdım, devam et</button></div>`}
  else if(!R.auth&&FIRST!=="cap"&&FIRST!=="staff"){body=`<div class="lcard"><h3>Bu telefonu kim kullanacak?</h3>
      <button class="btn pri" id="fCap" style="min-height:60px;font-size:17px">⚓ Kaptanım</button>
      <button class="btn dark" id="fStaff" style="min-height:60px;font-size:17px">Personelim (tallyman, vardiya)</button>
      <p class="note" style="margin:0">Personel kendi hesabını açmaz. Kaptanın telefonundaki QR kodu okutarak girer.</p></div>`}
  else if(!R.auth&&FIRST==="staff"){body=`<div class="lcard"><h3>Personel girişi</h3>
      <ol class="note" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Kaptandan telefonunda <b>Rapor → Personel paketi hazırla → QR göster</b>’i açmasını isteyin.</li><li>Aşağıdaki düğmeye basıp kamerayı o ekrana tutun.</li><li>Adınızı seçip kaptanın size verdiği şifreyle girin.</li></ol>
      ${scanCard}</div>${loadCard(false)}<button class="lk" id="fBack2">Geri</button>`}
  else if(!R.auth){body=`<div class="lcard"><h3>Kaptan hesabı oluştur</h3>
      <label class="field">Adınız<input id="sN" placeholder="Örn. Kpt. A. Yılmaz" autocomplete="name"></label>
      <label class="field">Şifre<input id="sP1" type="password" autocomplete="new-password"></label>
      <label class="field">Şifre (tekrar)<input id="sP2" type="password" autocomplete="new-password"></label>
      <p class="err" id="sE" hidden></p><button class="btn pri" id="sGo">Kur ve giriş yap</button>
      <p class="note" style="margin:0">Kaptan tüm bölümlere erişir. Personel, sizin belirlediğiniz şifreyle yalnızca Olay Bas, Kayıt ve Tally bölümlerine girer.</p></div><button class="lk" id="fBack2">Geri</button>`}
  else if(LV==="forgot"){body=`<div class="lcard"><h3>Kaptan şifresini yenile</h3>
      <label class="field">Kurtarma kodu<input id="fC" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX"></label>
      <label class="field">Yeni şifre<input id="fP" type="password" autocomplete="new-password"></label>
      <p class="err" id="fE" hidden></p><button class="btn pri" id="fGo">Şifreyi yenile</button><button class="lk" id="fBack">Girişe dön</button></div>`}
  else{const c=cur(),vs=c?[vesselOf(c)]:R.vessels;
    const users=[{id:"cap",name:capName(),sub:"Kaptan"}];
    vs.forEach(v=>(v.members||[]).filter(m=>m.pw).forEach(m=>users.push({id:m.id,name:m.name,sub:[m.role,vs.length>1?v.name:""].filter(Boolean).join(" · ")})));
    body=`<div class="lcard"><h3>Kim giriyor?</h3><div class="pick" id="lU">${users.map((u,i)=>`<button data-u="${u.id}" class="${i===0&&users.length===1?"on":""}">${esc(u.name)}<span>${esc(u.sub||"")}</span></button>`).join("")}</div>
      <label class="field">Şifre<input id="lP" type="password" autocomplete="current-password"></label>
      <p class="err" id="lE" hidden></p><button class="btn pri" id="lGo">Giriş</button>
      ${users.length===1?`<p class="note" style="margin:0">Personel listede yoksa: kaptan “Gemiler → Üyeler”den şifre belirlemeli ve bu telefona paket yüklemeli.</p>`:""}
      <button class="lk" id="lForgot">Kaptan şifremi unuttum</button></div>${scanCard}${loadCard(false)}`}
  L.innerHTML=`<div class="box">${head}${installCard()}${body}${FB?`<button class="lk" id="toOnline">İnternetli girişe dön</button>`:""}</div>`;wireInstall();
  if($("#toOnline"))$("#toOnline").onclick=()=>{LOGINMODE="online";renderLogin()};
  // wire
  const lin=$("#lLoad");if(lin){
    $("#lF").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#lIn").value=r.result;$("#lLoad").click()};r.readAsText(f);ev.target.value=""};
    lin.onclick=()=>{const e=$("#lInE");try{const o=dec($("#lIn").value);if(o.k==="tally")throw{msg:"Bu bir personel sayımı. Kaptan telefonunda Rapor → “Personel kayıtlarını al” ile yükleyin."};
      const m=importData(o);LV="login";renderLogin();toast(m+". Şimdi adınızı seçip şifrenizle girin.")}catch(x){e.hidden=false;e.textContent=x&&x.msg?x.msg:"Kod okunamadı. Tamamını kopyaladığınızdan emin olun."}}}
  if($("#fCap"))$("#fCap").onclick=()=>{FIRST="cap";renderLogin()};
  if($("#fStaff"))$("#fStaff").onclick=()=>{FIRST="staff";renderLogin()};
  if($("#fBack2"))$("#fBack2").onclick=()=>{FIRST=null;renderLogin()};
  if($("#lScan"))$("#lScan").onclick=()=>scanSheet("Kaptanın QR kodunu okutun",o=>{try{if(o.k!=="pack")throw{msg:"Bu bir personel sayımı. Kaptan telefonunda Rapor → “Personel kayıtlarını al” ile okutun."};
    const m=importData(o);LV="login";renderLogin();toast(m+". Şimdi adınızı seçip şifrenizle girin.")}catch(e){toast(e&&e.msg?e.msg:"Okunan veri yüklenemedi")}});
  if($("#lRecOk"))$("#lRecOk").onclick=()=>{REC=null;LV="login";SES={role:"cap"};saveSes();enterApp()};
  if($("#sGo"))$("#sGo").onclick=()=>{const e=$("#sE"),p1=$("#sP1").value,p2=$("#sP2").value;
    if(p1.length<4){e.hidden=false;e.textContent="Şifre en az 4 karakter olmalı";return}
    if(p1!==p2){e.hidden=false;e.textContent="Şifreler aynı değil";return}
    const code=Array.from({length:3},()=>Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,"X")).join("-");
    R.auth=Object.assign({name:$("#sN").value.trim()||"Kaptan"},mkPw(p1),{rec:mkPw(code)});save();REC=code;LV="rec";renderLogin()};
  if($("#lU")){let sel=$("#lU .on")?"cap":null;
    $$("#lU [data-u]").forEach(b=>b.onclick=()=>{sel=b.dataset.u;$$("#lU [data-u]").forEach(x=>x.classList.toggle("on",x===b));$("#lP").focus()});
    const tryIn=()=>{const e=$("#lE"),pw=$("#lP").value;if(!sel){e.hidden=false;e.textContent="Önce adınızı seçin";return}
      if(sel==="cap"?checkPw(R.auth,pw):checkPw((findMember(sel)||{}).m&&findMember(sel).m.pw,pw)){SES=sel==="cap"?{role:"cap"}:{role:"staff",id:sel};saveSes();enterApp()}
      else{e.hidden=false;e.textContent="Şifre yanlış";$("#lP").select()}};
    $("#lGo").onclick=tryIn;$("#lP").onkeydown=ev=>{if(ev.key==="Enter")tryIn()};
    $("#lForgot").onclick=()=>{LV="forgot";renderLogin()}}
  if($("#fGo")){$("#fBack").onclick=()=>{LV="login";renderLogin()};
    $("#fGo").onclick=()=>{const e=$("#fE"),c=$("#fC").value.trim().toUpperCase();
      if(!R.auth.rec||!checkPw(R.auth.rec,c)){e.hidden=false;e.textContent="Kurtarma kodu yanlış";return}
      if($("#fP").value.length<4){e.hidden=false;e.textContent="Yeni şifre en az 4 karakter olmalı";return}
      Object.assign(R.auth,mkPw($("#fP").value));save();LV="login";SES={role:"cap"};saveSes();toast("Şifre yenilendi");enterApp()}}
}

/* ---------- render ---------- */
function renderTab(){({fleet:renderFleet,ev:renderTaps,log:renderLog,tally:renderTally,hold:renderHolds,rep:renderRep})[TAB]()}
function renderAll(){renderHeader();renderTab()}

/* ---------- boot ---------- */
openDB().then(load).then(async d=>{const m=migrate(d);R=m||sample();if(!m)save();
  const ok=!inFrame&&await fbWait(6000);
  if(ok){try{fbInit();FB.au.onAuthStateChanged(FB.auth,u=>authChanged(u));return}catch(e){FB=null}}
  SES=loadSes();if(SES)enterApp();else renderLogin()});
})();
</script>

</body>
</html>
